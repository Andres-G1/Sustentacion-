{% extends "Aprendiz_config.html" %}

{% block title %}SENA Attendance{% endblock %}

{% block content %}

<main class="container my-5">
    <div class="page-card card shadow-sm" style="max-width: 650px; margin: 0 auto;">
        <div class="card-header bg-warning text-dark py-3">
            <h1 class="h5 mb-0">Modificar Ficha</h1>
            <small class="text-dark-50">Carrera actual: {{ carrera_actual.Nom_Car }} · Ficha original: {{ ficha.Num_Fic }}</small>
        </div>
        <div class="card-body p-4">
            <form action="{{ url_for('token.Alter_token', career=carrera_actual.Id_Car, old_token=ficha.Num_Fic) }}" method="POST">
                
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="career" class="form-label">Carrera</label>
                        <select name="career" id="career" class="form-select" required>
                            {% for c in career_avaliable %}
                                <option value="{{ c.Id_Car }}" {% if c.Id_Car == carrera_actual.Id_Car %}selected{% endif %}>
                                    {{ c.Nom_Car }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label for="token" class="form-label">Número de Ficha</label>
                        <input 
                            type="number" 
                            class="form-control" 
                            id="token" 
                            name="token" 
                            value="{{ ficha.Num_Fic }}" 
                            placeholder="Ej: 3407200" 
                            required
                        >
                    </div>
                    <div class="col-md-6">
                        <label for="fec_inicio" class="form-label">Fecha de Inicio</label>
                        <input 
                            type="date" 
                            class="form-control" 
                            id="fec_inicio" 
                            name="fec_inicio" 
                            value="{{ ficha.Fec_inicio_Fic }}" 
                            required
                        >
                    </div>
                    <div class="col-md-6">
                        <label for="fec_fin" class="form-label">Fecha de Fin</label>
                        <input 
                            type="date" 
                            class="form-control" 
                            id="fec_fin" 
                            name="fec_fin" 
                            value="{{ ficha.Fec_Fin_Fic }}" 
                            required
                        >
                    </div>

                    <div class="col-md-12">
                        <label for="jornada" class="form-label">Jornada</label>
                        <select name="jornada" id="jornada" class="form-select" required>
                            <option value="Mañana" {% if ficha.Jor_Fic == 'Mañana' %}selected{% endif %}>Mañana</option>
                            <option value="Tarde" {% if ficha.Jor_Fic == 'Tarde' %}selected{% endif %}>Tarde</option>
                            <option value="Noche" {% if ficha.Jor_Fic == 'Noche' %}selected{% endif %}>Noche</option>
                        </select>
                    </div>
                </div>

                {% if error %}
                    <div class="alert alert-danger mt-3" role="alert">
                        {{ error }}
                    </div>
                {% endif %}

                <div class="d-flex gap-2 justify-content-end mt-4">
                    <a href="{{ url_for('token.module_token_config') }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</main>

{% endblock %}
